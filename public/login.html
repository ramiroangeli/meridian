<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meridiano: ingreso</title>
<style>
:root{--bg:#eaefee;--surface:#fbfcfc;--ink:#12201e;--muted:#566664;--line:#d2dbd9;--accent:#0d5f66;--crit:#b93a2c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1514;--surface:#152020;--ink:#e4ecea;--muted:#94a5a2;--line:#2b3a38;--accent:#58bdb8;--crit:#f08576;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;margin:0;letter-spacing:-.02em} p{margin:0;color:var(--muted)}
input,button{font:inherit;padding:9px 11px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600;cursor:pointer}
#err{color:var(--crit);min-height:1.4em}
</style></head><body>
<form id="f"><h1>Meridiano</h1><p>Ingresá la contraseña del tablero.</p>
<label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
<button type="submit">Entrar</button><div id="err" role="alert"></div></form>
<script>
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();
  fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})})
  .then(function(r){if(r.ok){location.href="/";}else{document.getElementById("err").textContent="Contraseña incorrecta. Probá de nuevo.";}})
  .catch(function(){document.getElementById("err").textContent="No se pudo conectar. Revisá tu conexión.";});});
</script></body></html>
