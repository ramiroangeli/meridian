<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sala de control. Rail fijo a la izquierda, franja de meridianos arriba, tablero denso con cifras en mono. */
:root{
  --bg:#eaefee; --surface:#fbfcfc; --surface-2:#f1f5f4; --ink:#12201e; --muted:#566664; --line:#d2dbd9;
  --accent:#0d5f66; --accent-ink:#ffffff; --accent-soft:#d9ebea;
  --good:#17794a; --warn:#a86200; --crit:#b93a2c; --info:#2a5fa8;
  --good-bg:#dff1e7; --warn-bg:#f8ead2; --crit-bg:#f8e0dc; --info-bg:#dfe9f7; --idle-bg:#e6ebea;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1514; --surface:#152020; --surface-2:#1b2928; --ink:#e4ecea; --muted:#94a5a2; --line:#2b3a38;
    --accent:#58bdb8; --accent-ink:#06211f; --accent-soft:#17383a;
    --good:#5fcf95; --warn:#e3a44a; --crit:#f08576; --info:#7fb0f0;
    --good-bg:#143526; --warn-bg:#3a2c12; --crit-bg:#40201b; --info-bg:#1a2c47; --idle-bg:#22302e;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#152020; --surface-2:#1b2928; --ink:#e4ecea; --muted:#94a5a2; --line:#2b3a38;
  --accent:#58bdb8; --accent-ink:#06211f; --accent-soft:#17383a;
  --good:#5fcf95; --warn:#e3a44a; --crit:#f08576; --info:#7fb0f0;
  --good-bg:#143526; --warn-bg:#3a2c12; --crit-bg:#40201b; --info-bg:#1a2c47; --idle-bg:#22302e;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:-.02em;padding:0 8px;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .count{font-family:var(--mono);font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:0 7px}
.nav a[aria-current="page"] .count{background:var(--accent-ink);color:var(--accent)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.main{padding:18px 24px 48px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{font-size:12px;font-weight:600;border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:3px 8px}
select,.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{border-color:var(--crit);color:var(--crit);font-weight:600}
.btn.small{padding:4px 9px;font-size:13px}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:8px 12px;margin-bottom:14px;font-weight:500}
.sim{background:var(--info-bg);color:var(--info);border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:14px}
/* franja de meridianos */
.meridian{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px 12px;margin-bottom:16px}
.mer-line{position:relative;height:26px;margin:0 6px 8px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/24));border-bottom:1px solid var(--muted)}
.mer-dot{position:absolute;bottom:-6px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translateX(-50%)}
.mer-tag{position:absolute;bottom:9px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted)}
.mer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.mer-cell{display:flex;flex-direction:column;gap:1px}
.mer-cell b{font-weight:600}
.mer-cell .t{font-family:var(--mono);font-size:20px}
.mer-cell span{color:var(--muted);font-size:13px}
/* tablero */
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:13px;color:var(--muted);margin-top:2px}
.up{color:var(--good)} .down{color:var(--crit)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:11px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.idle{background:var(--idle-bg);color:var(--muted)}
/* barras */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 86px;gap:10px;align-items:center;font-size:14px}
.bar-track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.bar-row .num{text-align:right;font-size:13px}
.limit{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.limit:last-child{border-bottom:0}
/* gráficos */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .lbl{fill:var(--ink);font-family:var(--body);font-size:12px;font-weight:500}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);z-index:2}
.tip b{font-family:var(--mono);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
details{margin-top:10px;font-size:13px}
summary{cursor:pointer;color:var(--accent);font-weight:500}
/* agentes */
.agents{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,1fr);gap:16px;align-items:start}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.station{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-height:112px}
.station:hover{border-color:var(--accent)}
.station[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.station .code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.station .name{font-weight:600;line-height:1.25}
.station .pill{align-self:flex-start;white-space:normal;text-align:left}
.station .task{font-size:12px;color:var(--muted);margin-top:auto}
.ficha dl{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;margin:10px 0 0;font-size:14px}
.ficha dt{color:var(--muted)} .ficha dd{margin:0}
.runs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.runs span{display:block;font-size:12px;color:var(--muted)}
.adot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.teams{display:flex;flex-direction:column;gap:16px;min-width:0}
.team h3{font-family:var(--display);font-size:15px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:2px}
.team h3 .num{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.office{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(280px,1fr);gap:16px;align-items:start}
.office-stage{padding:0;overflow:hidden}
.office-help{padding:9px 14px;margin:0;line-height:1.7}
.office-help b{font-weight:600;color:var(--ink)}
.stage{position:relative;height:clamp(460px,70vh,760px);background:linear-gradient(var(--surface-2),var(--bg));touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;outline-offset:-2px}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas:active{cursor:grabbing}
.of-tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.of-tag,.of-room{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;will-change:transform;font:inherit}
.of-tag{display:flex;align-items:center;gap:5px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:2px 9px 2px 7px;font-size:12px}
.of-tag i{width:8px;height:8px;border-radius:50%;flex:none}
.of-tag b{font-weight:600}
.of-tag span{display:none;color:var(--muted)}
.of-tag:hover span,.of-tag[aria-pressed="true"] span{display:inline}
.of-tag[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.of-tag.compact{padding:3px}
.of-tag.compact b{display:none}
.of-tag.compact:hover b{display:inline}
.of-room{background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:3px 9px;font-size:12px;font-weight:600;letter-spacing:.01em;opacity:.92}
.of-room:hover{opacity:1}
.of-bar{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:20000;padding-bottom:2px}
.of-chip{flex:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.of-chip:hover{border-color:var(--accent)}
.of-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.of-tour{position:absolute;right:10px;bottom:10px;z-index:20000}
.office-legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 14px 11px;margin:0;font-size:12px;color:var(--muted)}
.office-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.nav .count.tc{background:var(--info-bg);color:var(--info)}
.tform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.tform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.tform .wide{grid-column:1/-1}
.tform input,.tform textarea,.tform select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.tform textarea{resize:vertical}
.tform-acts{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.tboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
.tcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tcol h3{font-family:var(--display);font-size:15px;margin:0}
.tcol h3 .num{color:var(--muted);font-weight:400;font-size:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.tcard.pr-alta{border-left-color:var(--warn)}
.tcard h4{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.tcard p{margin:0;font-size:13px;color:var(--muted)}
.tcard .tres{color:var(--ink)}
.tflow{font-size:12px;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap;gap:3px}
.tflow b{color:var(--ink);font-weight:600}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tmeta .btn{margin-left:auto}
.of-tag u{text-decoration:none;background:var(--warn);color:#fff;border-radius:8px;font-size:10px;font-weight:700;padding:0 5px;margin-left:2px}
.of-tag u:empty{display:none}
.danger-zone{border-color:var(--crit)}
.limit .sub{margin:2px 0 0;font-size:13px}
/* decisiones */
.prop{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:8px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.prop.urg{border-left-color:var(--crit)} .prop.rev{border-left-color:var(--warn)} .prop.idea{border-left-color:var(--muted)}
.prop h3{margin:0;font-size:16px;font-weight:600}
.prop .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.prop .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;font-size:13px}
.prop .facts b{display:block;color:var(--muted);font-weight:500;font-size:12px}
.prop .acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin:3px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.step{border-top:3px solid var(--line);padding-top:8px;font-size:14px}
.step.done{border-top-color:var(--good)} .step.now{border-top-color:var(--accent)}
.step b{display:block}
.step span{color:var(--muted);font-size:13px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{font-size:19px;padding:0} .brand small,.rail-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;flex:1;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:6px 9px;font-size:14px}
  .main{padding:14px 16px 40px}
  .top h1{font-size:24px}
  .agents,.office{grid-template-columns:1fr}
  .stage{height:440px}
  .office-help{font-size:12px}
  .bar-row{grid-template-columns:96px 1fr 76px}
}
@media (prefers-reduced-motion:no-preference){.bar-fill{transition:width .35s ease}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Meridiano<small>Finanzas personales entre países, con agentes</small></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="rail-foot" id="foot">v0.3. Los datos salen de la base; la vigilancia diaria y tu Claude mantienen a los agentes trabajando.</div>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="title">Resumen</h1>
      <div class="controls">
        <span class="badge" id="demoBadge" hidden>Datos de ejemplo</span>
        <label for="base" class="badge" style="border:0;padding:0">Moneda base</label>
        <select id="base"><option>AUD</option><option>USD</option><option>EUR</option></select>
        <button class="btn danger" id="pause" type="button">Pausar agentes</button>
      </div>
    </div>
    <div id="pausedBanner" class="banner" hidden>Agentes en pausa. No se ejecuta ninguna tarea programada hasta que los reanudes.</div>
    <div id="view"></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/oficina.js"></script>
<script>
(function(){
"use strict";
/* ---------- datos: llegan de /api/state ---------- */
var FX,ZONES,ACCOUNTS,LIABS,MONTHS,NW_HIST,CONTRIB,FLOW,AGENTS,PROPS,HISTORY,FISCAL,COSTS,TASKS=[],SOURCES={},USER={},deferred=false;
var ST={prog:["Programado","idle","◷"],run:["Ejecutándose","info","▶"],wait:["Esperando datos","warn","◌"],appr:["Pendiente de aprobación","warn","▲"],done:["Completado","good","✓"],err:["Con error","crit","✕"],off:["En pausa","idle","Ⅱ"],idea:["Conceptual","idle","·"]};

/* ---------- estado ---------- */
var state={base:"AUD",paused:false,agent:"E"};
var VIEWS=[["resumen","Resumen"],["cuentas","Cuentas"],["caja","Caja"],["cartera","Cartera"],["agentes","Agentes"],["tareas","Tareas"],["sala","Oficina 3D"],["decisiones","Decisiones"],["fiscal","Fiscal"],["conexiones","Conexiones"],["sistema","Sistema"]];

/* ---------- utilidades ---------- */
var nf0=new Intl.NumberFormat("es-AR",{maximumFractionDigits:0});
var nf1=new Intl.NumberFormat("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1});
function conv(aud){return aud*FX[state.base];}
function money(aud){return state.base+" "+nf0.format(Math.round(conv(aud)));}
function pct(x){return nf1.format(x*100)+"%";}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function sum(a,f){return a.reduce(function(t,x){return t+(f?f(x):x);},0);}
function assets(){return sum(ACCOUNTS,function(a){return a.aud;});}
function liabs(){return sum(LIABS,function(a){return a.aud;});}
function net(){return assets()-liabs();}
function group(key){var m={};ACCOUNTS.forEach(function(a){m[a[key]]=(m[a[key]]||0)+a.aud;});return Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];});}
function ageText(min){if(min<60)return "hace "+min+" min";if(min<2880)return "hace "+Math.round(min/60)+" h";return "hace "+Math.round(min/1440)+" días";}
function quality(min){if(min<=4320)return ["Al día","good"];if(min<=43200)return ["Envejecido","warn"];return ["Vencido","crit"];}
function pill(txt,cls,glyph){return '<span class="pill '+cls+'">'+(glyph?'<span aria-hidden="true">'+glyph+'</span>':'')+esc(txt)+'</span>';}
function agentState(a){if(state.paused&&(a.st==="prog"||a.st==="run"))return "off";return a.st;}
function stPill(k){var s=ST[k];return pill(s[0],s[1],s[2]);}
function pending(){return PROPS;}
function zoneName(id){var z=ZONES.filter(function(z){return z.id===id;})[0];return z?z.name:id;}
function clock(tz){try{return new Intl.DateTimeFormat("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:tz}).format(new Date());}catch(e){return "--:--";}}

/* ---------- gráficos ---------- */
function attachTip(box,svg,handler){
  var tip=document.createElement("div");tip.className="tip";box.appendChild(tip);
  function move(ev){var r=svg.getBoundingClientRect();var pt=ev.touches?ev.touches[0]:ev;var out=handler((pt.clientX-r.left)/r.width,(pt.clientY-r.top)/r.height,ev.target);
    if(!out){tip.style.opacity=0;return;}tip.innerHTML=out.html;tip.style.left=Math.min(Math.max(out.x*r.width,70),r.width-70)+"px";tip.style.top=(out.y*r.height)+"px";tip.style.opacity=1;}
  svg.addEventListener("mousemove",move);svg.addEventListener("touchstart",move,{passive:true});
  svg.addEventListener("mouseleave",function(){tip.style.opacity=0;handler(-1,-1,null);});
}
function lineChart(box){
  var W=640,H=250,L=58,R=118,T=14,B=28;
  var a=NW_HIST.slice();a[a.length-1]=net();
  var series=[{n:"Patrimonio neto",v:a.map(conv),c:"var(--s1)"}];if(hasContrib())series.push({n:"Solo aportes",v:CONTRIB.map(conv),c:"var(--s2)"});
  var all=[].concat.apply([],series.map(function(x){return x.v;})),lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(hi-lo<1){var pad=Math.max(Math.abs(hi)*0.05,100);lo-=pad;hi+=pad;}
  var step=Math.pow(10,Math.floor(Math.log10(hi-lo)));if((hi-lo)/step<3)step/=2;
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  function X(i){return L+(W-L-R)*i/(a.length-1);} function Y(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Patrimonio neto y aportes acumulados, últimos 12 meses">';
  for(var g=lo;g<=hi+1;g+=step){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(Y(g)+4)+'" text-anchor="end">'+nf0.format(g/1000)+' mil</text>';}
  MONTHS.forEach(function(m,i){if(i%2===1||i===a.length-1)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+m+'</text>';});
  var ends=series.map(function(se){return Y(se.v[se.v.length-1]);});
  if(ends.length>1&&Math.abs(ends[0]-ends[1])<16){var mid=(ends[0]+ends[1])/2,up=ends[0]<ends[1]?0:1;ends[up]=mid-8;ends[1-up]=mid+8;}
  series.forEach(function(se,k){
    var d=se.v.map(function(v,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);}).join(" ");
    s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="2" stroke-linejoin="round"'+(k?' stroke-dasharray="5 4"':'')+'/>';
    s+='<circle cx="'+X(a.length-1)+'" cy="'+Y(se.v[se.v.length-1])+'" r="4" fill="'+se.c+'" stroke="var(--surface)" stroke-width="2"/>';
    s+='<text class="lbl" x="'+(W-R+10)+'" y="'+(ends[k]+4)+'">'+se.n+'</text>';
  });
  s+='<line id="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" opacity="0"/></svg>';
  box.innerHTML=s+'<div class="legend"><span><i style="background:var(--s1)"></i>Patrimonio neto</span><span'+(series[1]?'':' hidden')+'><i style="background:var(--s2)"></i>Solo aportes (línea punteada)</span></div>';
  var svg=box.querySelector("svg"),xh=svg.querySelector("#xh");
  attachTip(box,svg,function(fx){
    if(fx<0){xh.setAttribute("opacity",0);return null;}
    var i=Math.round((fx*W-L)/(W-L-R)*(a.length-1));if(i<0||i>=a.length){xh.setAttribute("opacity",0);return null;}
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("opacity",1);
    if(!series[1])return {x:X(i)/W,y:Y(series[0].v[i])/H,html:MONTHS[i]+" · neto <b>"+nf0.format(series[0].v[i])+"</b>"};
    var diff=series[0].v[i]-series[1].v[i];
    return {x:X(i)/W,y:Y(Math.max(series[0].v[i],series[1].v[i]))/H,html:MONTHS[i]+" · neto <b>"+nf0.format(series[0].v[i])+"</b> · aportes <b>"+nf0.format(series[1].v[i])+"</b> · mercado y divisas <b>"+(diff>=0?"+":"")+nf0.format(diff)+"</b>"};
  });
}
function flowChart(box){
  var W=640,H=250,L=58,R=12,T=14,B=28,n=FLOW.m.length;
  var keys=[["esencial","Gastos esenciales","var(--s1)"],["discrecional","Gastos discrecionales","var(--s2)"],["fiscal","Reserva fiscal","var(--s3)"],["ahorro","Ahorro","var(--s4)"]];
  var rows=FLOW.m.map(function(m,i){var o={esencial:FLOW.esencial[i],discrecional:FLOW.discrecional[i],fiscal:FLOW.fiscal[i]};o.ahorro=FLOW.ingreso[i]-o.esencial-o.discrecional-o.fiscal;return o;});
  var hi=Math.ceil(conv(Math.max.apply(null,FLOW.ingreso))/1000)*1000,bw=Math.min(46,(W-L-R)/n*0.55);
  function Y(v){return T+(H-T-B)*(1-v/hi);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Destino del ingreso mensual, últimos 6 meses">';
  for(var g=0;g<=hi;g+=hi/4){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(Y(g)+4)+'" text-anchor="end">'+nf0.format(g)+'</text>';}
  rows.forEach(function(o,i){
    var cx=L+(W-L-R)*(i+0.5)/n,acc=0;
    keys.forEach(function(k,j){var v=conv(o[k[0]]),y1=Y(acc+v),y0=Y(acc),h=Math.max(y0-y1-2,1);acc+=v;
      s+='<rect data-i="'+i+'" data-k="'+j+'" x="'+(cx-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+h+'" rx="'+(j===keys.length-1?4:0)+'" fill="'+k[2]+'"/>';});
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+FLOW.m[i]+'</text>';
  });
  s+='</svg><div class="legend">'+keys.map(function(k){return '<span><i style="background:'+k[2]+'"></i>'+k[1]+'</span>';}).join("")+'</div>';
  box.innerHTML=s;var svg=box.querySelector("svg");
  attachTip(box,svg,function(fx,fy,t){
    if(!t||!t.dataset||t.dataset.i===undefined)return null;
    var i=+t.dataset.i,k=keys[+t.dataset.k],v=rows[i][k[0]];
    return {x:fx,y:fy,html:FLOW.m[i]+" · "+k[1]+" <b>"+money(v)+"</b> · "+pct(v/FLOW.ingreso[i])+" del ingreso"};
  });
}
function barList(pairs,total){
  var max=pairs[0][1];
  return '<div class="bars">'+pairs.map(function(p){return '<div class="bar-row"><span>'+esc(p[0])+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(p[1]/max*100).toFixed(1)+'%"></div></div><span class="num">'+pct(p[1]/total)+'</span></div>';}).join("")+'</div>';
}

/* ---------- vistas ---------- */
function hasContrib(){return CONTRIB.length>0&&CONTRIB.every(function(c){return c!==null&&c!==undefined;});}
function lastFlow(){var n=FLOW.m.length-1;if(n<0)return null;var o={m:FLOW.m[n],i:FLOW.ingreso[n],e:FLOW.esencial[n],d:FLOW.discrecional[n],f:FLOW.fiscal[n]};o.s=o.i-o.e-o.d-o.f;return o;}
function freeCash(){return sum(ACCOUNTS.filter(function(x){return (x.cls==="Efectivo"||x.cls==="Stablecoins")&&!/impuesto|fiscal/i.test(x.use+x.n);}),function(x){return x.aud;});}
function emptyBox(t){return '<div class="empty">'+t+'</div>';}
function meridian(){
  var tot=assets();if(!ZONES.length)return "";
  var line='<div class="mer-line" aria-hidden="true">'+ZONES.map(function(z){var x=((z.lon+180)/360*100).toFixed(1);return '<span class="mer-tag" style="left:'+x+'%">'+z.id+'</span><span class="mer-dot" style="left:'+x+'%"></span>';}).join("")+'</div>';
  var cells=ZONES.slice().sort(function(x,y){return x.lon-y.lon;}).map(function(z){var acc=ACCOUNTS.filter(function(a){return a.zone===z.id;}),v=sum(acc,function(a){return a.aud;});
    return '<div class="mer-cell"><b>'+z.name+'</b><span class="t" data-tz="'+z.tz+'">'+clock(z.tz)+'</span><span><span class="num">'+(tot?pct(v/tot):"–")+'</span> de los activos · '+acc.length+(acc.length===1?' cuenta':' cuentas')+'</span></div>';}).join("");
  return '<section class="meridian" aria-label="Activos por jurisdicción y hora local">'+line+'<div class="mer-grid">'+cells+'</div></section>';
}
var V={};
V.resumen=function(){
  var a=NW_HIST.slice();if(a.length)a[a.length-1]=net();var n=a.length,d=n>1?a[n-1]-a[n-2]:null,lf=lastFlow(),fc=freeCash();
  var stale=ACCOUNTS.filter(function(x){return quality(x.age)[1]==="crit";}).length,p=pending();
  var story="";

   '<div class="tile"><div class="k">Patrimonio neto</div><div class="v">'+money(net())+'</div><div class="d">'+(d===null?(ACCOUNTS.length?'Primer mes registrado':'Sin cuentas todavía'):'<span class="'+(d>=0?"up":"down")+'">'+(d>=0?"▲ ":"▼ ")+money(Math.abs(d))+'</span> en el mes')+'</div></div>'+
   '<div class="tile"><div class="k">Tasa de ahorro'+(lf?', '+lf.m:'')+'</div><div class="v">'+(lf&&lf.i?pct(lf.s/lf.i):'–')+'</div><div class="d">'+(lf?money(lf.s)+' después de la reserva fiscal':'Requiere movimientos importados')+'</div></div>'+
   '<div class="tile"><div class="k">Meses de reserva</div><div class="v">'+(lf&&lf.e?nf1.format(fc/lf.e):'–')+'</div><div class="d">'+(lf&&lf.e?'Efectivo libre sobre gasto esencial':'Efectivo libre: '+money(fc))+'</div></div>'+
   '<div class="tile"><div class="k">Decisiones pendientes</div><div class="v">'+p.length+'</div><div class="d">'+(stale?stale+(stale===1?' cuenta con datos vencidos':' cuentas con datos vencidos'):'Todos los datos al día')+'</div></div>'+
  '</div>'+
  '<div class="grid g-2">'+
   '<section class="panel"><h2>Evolución del patrimonio</h2>'+(n>1?'<p class="sub">'+story+'</p><div class="chart" id="c-nw"></div>'+
    '<details><summary>Ver como tabla</summary><div class="scroll"><table><tr><th>Mes</th><th class="r">Neto</th>'+(hasContrib()?'<th class="r">Aportes</th>':'')+'</tr>'+MONTHS.map(function(m,k){return '<tr><td>'+m+'</td><td class="r num">'+nf0.format(conv(a[k]))+'</td>'+(hasContrib()?'<td class="r num">'+nf0.format(conv(CONTRIB[k]))+'</td>':'')+'</tr>';}).join("")+'</table></div></details>'
    :emptyBox('El gráfico aparece desde el segundo mes con datos. La vigilancia diaria guarda una foto del patrimonio cada mes.'))+'</section>'+
   '<section class="panel"><h2>Requiere tu atención</h2><p class="sub">Propuestas de los agentes, de más a menos urgente.</p><div class="grid" style="gap:10px">'+
    (p.length?p.slice(0,3).map(function(x){return '<a href="#decisiones" style="text-decoration:none;color:inherit"><div class="prop '+x.lvl+'" style="padding:10px 12px"><div class="meta"><span>'+x.lbl+'</span><span>'+esc(who(x.ag))+'</span></div><div style="font-weight:600">'+esc(x.t)+'</div></div></a>';}).join(""):emptyBox('No hay nada pendiente.'))+
   '</div></section>'+
  '</div>';
};
V.resumen.after=function(){var b=document.getElementById("c-nw");if(b)lineChart(b);};

  '<div class="tile"><div class="k">Ahorro</div><div class="v">'+money(s)+'</div><div class="d">'+(i?pct(s/i)+' del ingreso':'')+'</div></div></div>'+
  '<div class="grid g-2"><section class="panel"><h2>Destino del ingreso</h2><p class="sub">Cada barra suma el ingreso del mes, en '+state.base+'.</p><div class="chart" id="c-flow"></div></section>'+
  '<section class="panel"><h2>Previsión de liquidez a 90 días</h2><p class="sub">Efectivo libre proyectado con el ahorro promedio de '+k+(k===1?' mes':' meses')+'.</p>'+

V.cartera=function(){
  var tot=assets();
  if(!tot)return '<section class="panel"><h2>Cartera</h2>'+emptyBox('Sin activos valuados todavía. Configurá Kraken o cargá tus cuentas para ver la asignación.')+'</section>';
  var cls=group("cls"),cur=group("cur").map(function(p){return [p[0]==="Varias"?"Otras cripto":p[0],p[1]];}),zon=group("zone").map(function(p){return [zoneName(p[0]),p[1]];});
  var isC=function(a){return a.cls==="Bitcoin"||a.cls==="Otras cripto";};
  var crypto=sum(ACCOUNTS.filter(isC),function(a){return a.aud;}),btc=sum(ACCOUNTS.filter(function(a){return a.cls==="Bitcoin";}),function(a){return a.aud;});
  var big=cls[0];
  function lim(name,val,rule,ok){return '<div class="limit"><span>'+name+'<br><span style="color:var(--muted);font-size:13px">'+rule+'</span></span><span style="text-align:right"><span class="num">'+(val===null?"–":pct(val))+'</span><br>'+(val===null?pill("Sin datos","idle"):pill(ok?"Dentro del límite":"Fuera del límite",ok?"good":"crit",ok?"✓":"✕"))+'</span></div>';}
  return '<div class="grid g-2">'+
  '<section class="panel"><h2>Por clase de activo</h2><p class="sub">Porcentaje sobre activos totales.</p>'+barList(cls,tot)+'</section>'+
  '<section class="panel"><h2>Límites de la política de inversión</h2><p class="sub">Reglas de ejemplo. Las tuyas se escriben antes de automatizar nada.</p>'+
   lim("Criptomonedas sobre activos",crypto/tot,"Máximo 25%",crypto/tot<=0.25)+
   lim("Bitcoin dentro de cripto",crypto?btc/crypto:null,"Mínimo 50%",crypto?btc/crypto>=0.5:true)+
   lim("Mayor clase: "+big[0],big[1]/tot,"Máximo 45% en una sola clase",big[1]/tot<=0.45)+
   (USER.demo?'':'<p class="sub" style="margin-top:10px">Con datos parciales, estos porcentajes describen solo las cuentas cargadas, no tu patrimonio completo.</p>')+'</section>'+
  '<section class="panel"><h2>Por moneda del saldo</h2><p class="sub">La moneda de la cuenta no siempre es la exposición económica.</p>'+barList(cur,tot)+'</section>'+
  '<section class="panel"><h2>Por país de la cuenta</h2><p class="sub">Dónde está custodiado cada activo.</p>'+barList(zon,tot)+'</section>'+
  '</div>';

   '<p class="sub" style="margin:0 0 8px">'+esc(sel.title)+' · '+esc(sel.n)+'</p>'+stPill(k)+

function inForm(){var a=document.activeElement;return !!(a&&a.closest&&a.closest("form"));}
document.getElementById("view").addEventListener("submit",function(e){
  if(e.target.id==="resetForm"){e.preventDefault();
    var rm=document.getElementById("resetMsg");if(val("resetConfirm").trim()!=="BORRAR"){rm.textContent="Escribí BORRAR, en mayúsculas, para confirmar.";return;}
    rm.textContent="Borrando…";
    fetch("/api/reset",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({confirm:"BORRAR"})})
    .then(function(r){return r.json().then(function(j){if(!r.ok){rm.textContent=j.error||"No se pudo completar.";return;}document.activeElement&&document.activeElement.blur&&document.activeElement.blur();lastJson="";load();});})
    .catch(function(){rm.textContent="No se pudo conectar. Revisá tu conexión.";});return;}
  if(e.target.id!=="taskForm")return;e.preventDefault();
  var msg=document.getElementById("tf-msg"),btn=e.target.querySelector("button[type=submit]");btn.disabled=true;msg.textContent="Asignando…";
  fetch("/api/tasks",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({to:val("tf-to"),priority:val("tf-pr"),title:val("tf-title").trim(),detail:val("tf-detail").trim()})})
  .then(function(r){if(r.status===401){location.href="/login";return;}return r.json().then(function(j){
    if(!r.ok){msg.textContent=j.error||"No se pudo asignar. Probá de nuevo.";btn.disabled=false;return;}
    state.draft=null;document.activeElement&&document.activeElement.blur&&document.activeElement.blur();load();});})
  .catch(function(){msg.textContent="No se pudo conectar. Revisá tu conexión.";btn.disabled=false;});
});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0);});
setInterval(function(){document.querySelectorAll("[data-tz]").forEach(function(el){el.textContent=clock(el.dataset.tz);});},30000);
var lastJson="";
function apply(d,json){
  var first=!lastJson;lastJson=json;
  FX=d.fx;ZONES=d.zones;ACCOUNTS=d.accounts;LIABS=d.liabs;MONTHS=d.months;NW_HIST=d.nwHist;CONTRIB=d.contrib;FLOW=d.flow;PROPS=d.props;TASKS=d.tasks||[];SOURCES=d.sources||{};HISTORY=d.history;FISCAL=d.fiscal;COSTS=d.costs;USER=d.user;
  if(AGENTS&&AGENTS.length===d.agents.length){d.agents.forEach(function(a,i){Object.assign(AGENTS[i],a);});}else{AGENTS=d.agents;}
  state.paused=d.paused;if(first&&FX[d.base])state.base=d.base;
  document.getElementById("demoBadge").hidden=!USER.demo;
  if(!first&&current()==="sala"&&sala){
    sala.update(officeData());var a=AGENTS.filter(function(x){return x.c===state.agent;})[0];if(a)document.getElementById("sala-ficha").innerHTML=ficha(a);
    document.getElementById("pause").textContent=state.paused?"Reanudar agentes":"Pausar agentes";document.getElementById("pause").className=state.paused?"btn primary":"btn danger";document.getElementById("pausedBanner").hidden=!state.paused;return;
  }
  if(inForm()){deferred=true;return;}
  render();
}
function load(){
  return fetch("/api/state",{credentials:"same-origin"}).then(function(r){
    if(r.status===401){location.href="/login";throw new Error("401");}
    if(!r.ok)return r.json().catch(function(){return {};}).then(function(j){throw new Error(j.hint?j.hint+" (código "+j.code+")":"estado "+r.status);});
    return r.text();
  }).then(function(t){if(t!==lastJson)apply(JSON.parse(t),t);}).catch(function(e){
    if(!lastJson&&e.message!=="401")document.getElementById("view").innerHTML='<div class="banner">No se pudo leer la base de datos. '+esc(e.message)+'</div>';
  });
}
function post(url,body){
  return fetch(url,{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(r.status===401){location.href="/login";}return load();});
}
document.getElementById("view").innerHTML='<div class="empty">Cargando datos…</div>';
load();setInterval(function(){if(!document.hidden)load();},20000);
})();
</script>
</body>
</html>
